<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Remind-Station</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #dropbox {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 250px;
      height: 120px;
      border: 2px dashed #666;
      padding: 10px;
      background: #fafafa;
    }
    .card {
      border: 1px solid #999;
      padding: 10px;
      margin: 10px 0;
      background: #f0f0f0;
    }
    .countdown { font-weight: bold; margin-left: 10px; color: darkred; }
    #cards { margin-top: 160px; }

    #notifBtn {
    position: fixed;   /* lo fija en la pantalla */
    top: 20px;         /* distancia desde arriba */
    right: 20px;       /* distancia desde la derecha */
    z-index: 9999;     /* asegura que quede por encima de otros elementos */
    padding: 8px 12px;
    background: #ffcc00;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
  }

  </style>
</head>
<body>
  <h1>Sesión</h1>
  <button id="notifBtn">🔔</button>
  <div id="dropbox">Arrastra aquí para crear nueva carta</div>
  <div id="cards"></div>

  <script>
    
    let counter = 0;
    const dropbox = document.getElementById("dropbox");
    const cardsContainer = document.getElementById("cards");


    document.getElementById("notifBtn").addEventListener("click", () => {
      Notification.requestPermission().then(permission => {
        if (permission === "granted") {
          alert("Notificaciones activadas ✅ \n/dateMM:DD:HH:'' por ejemplo /date6 para 6 meses después del punto 0 del inicio del año");
          // opcional: ocultar el botón después de aceptar
          document.getElementById("notifBtn").style.display = "none";
        } else {
          alert("No se activaron las notificaciones ❌");
        }
      });
    });

    if (Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    window.addEventListener("load", () => {
      loadCards();
    });

    document.addEventListener("input", e => {
      if (e.target.closest(".card")) {
        saveAllCards();
      }
    });


    function parseDelay(str) {
      let totalMs = 0;
      const regex = /(\d+)([hdsm'])/g;
      let match;
      while ((match = regex.exec(str)) !== null) {
        const value = parseInt(match[1]);
        const unit = match[2];
        if (unit === "h") totalMs += value * 3600000;
        else if (unit === "d") totalMs += value * 86400000;
        else if (unit === "s") totalMs += value * 1000;
        else if (unit === "'") totalMs += value * 60000;
      }
      return totalMs;
    }
  
    function nextAvailableId() {
      const data = JSON.parse(localStorage.getItem("cards")) || {};
      let id = 1;
      while (data[id] || document.querySelector(`[data-id="${id}"]`)) {
        id++;
      }
      return id;
    }


    function createCard(
      id = nextAvailableId(),
      delayStr = "",
      startAt = Date.now(),
      title = `pedido_${id}`,
      description = ""
    ) {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.id = id;
      card.dataset.startAt = startAt;
      card.dataset.delayStr = delayStr;
      card.dataset.delay = parseDelay(delayStr);

      card.innerHTML = `
        <input type="text" class="titleInput"
              value="${title}"
              data-id="${id}" data-field="title">
        <textarea class="descInput"
              placeholder="Descripción"
              data-id="${id}" data-field="description">${description}</textarea>
        <input type="text" class="delayInput"
              placeholder="ej: 20s, 1h1d"
              value="${delayStr}"
              data-id="${id}" data-field="delayStr">
        <button class="postpone">[➕⏲️]</button>
        <button class="delete">🗑️</button>
        <span class="countdown">--</span>
      `;

      cardsContainer.appendChild(card);
    }



    // guarda todas las cartas en localStorage
    function saveAllCards() {
      const data = {};
      const order = []; // Aquí guardaremos el orden visual exacto

      document.querySelectorAll(".card").forEach(card => {
        const id = card.dataset.id;
        order.push(id); // Guardamos el ID en la lista de orden
        
        data[id] = {
          title: card.querySelector(".titleInput").value,
          description: card.querySelector(".descInput").value,
          delayStr: card.querySelector(".delayInput").value,
          delay: parseInt(card.dataset.delay || 0),
          startAt: parseInt(card.dataset.startAt || Date.now())
        };
      });

      localStorage.setItem("cards", JSON.stringify(data));
      localStorage.setItem("cardsOrder", JSON.stringify(order)); // Guardamos el orden
    }

function loadCards() {
  const data = JSON.parse(localStorage.getItem("cards")) || {};
  const order = JSON.parse(localStorage.getItem("cardsOrder")) || [];
  
  cardsContainer.innerHTML = ""; // Limpiamos

  // Si hay un orden guardado, lo usamos para crear las cartas
  if (order.length > 0) {
    order.forEach(id => {
      // Verificamos que los datos existan (por seguridad)
      if (data[id]) {
        const meta = data[id];
        createCard(id, meta.delayStr, meta.startAt, meta.title, meta.description);
      }
    });
  } else {
    // Fallback por si es la primera vez (carga desordenada antigua)
    for (const [id, meta] of Object.entries(data)) {
      createCard(id, meta.delayStr, meta.startAt, meta.title, meta.description);
    }
  }
}

    // Guardar carta en localStorage
    function saveCard(id, delayStr="", startAt=Date.now()) {
      const data = JSON.parse(localStorage.getItem("cards")) || {};
      data[id] = { delayStr, startAt };
      localStorage.setItem("cards", JSON.stringify(data));
    }

    dropbox.addEventListener("dragover", e => e.preventDefault());
    dropbox.addEventListener("drop", e => {
      e.preventDefault();
      counter++;
      createCard(undefined, String(counter));
    });


    cardsContainer.addEventListener("click", e => {
      const card = e.target.closest(".card");
      if (!card) return;

    if (e.target.classList.contains("postpone")) {
      const delayInput = card.querySelector(".delayInput");
      const rawValue = delayInput.value.trim();
      const now = Date.now();
      const currentYear = new Date().getFullYear();
      const currentDelay = parseInt(card.dataset.delay) || 0;
      let currentStartAt = parseInt(card.dataset.startAt) || now;

      if (rawValue.startsWith("/date")) {
        const parts = rawValue.replace("/date", "").split(":").map(p => parseInt(p) || 0);
        const targetDate = new Date(currentYear, (parts[0] || 1) - 1, parts[1] || 1, parts[2] || 0, parts[3] || 0, parts[4] || 0);
        const targetMs = targetDate.getTime();
        if (targetMs > now) {
          card.dataset.startAt = now;
          card.dataset.delay = targetMs - now;
        } else {
          card.dataset.startAt = targetMs - currentDelay;
        }
      } else {
        const isNegative = rawValue.startsWith("-");
        const inputMs = parseDelay(isNegative ? rawValue.substring(1) : rawValue);
        if (isNegative) {
          card.dataset.startAt = currentStartAt - inputMs - currentDelay;
        } else if (inputMs > 0) {
          card.dataset.delay = inputMs;
          card.dataset.delayStr = rawValue;
          card.dataset.startAt = now;
        }
      }

      saveAllCards();
      
      // MANDAR AL FINAL: Así sale de la zona roja
      const cardsContainer = document.getElementById("cards");
      cardsContainer.appendChild(card);

      // Si la línea se quedó sola al final o no hay nada arriba, podrías ocultarla,
      // pero con 'after' la línea siempre se mantiene pegada a la última que sonó.
    }

          if (e.target.classList.contains("delete")) {
            card.remove();
            saveAllCards();
          }
        });


function checkRings() {
  const now = Date.now();
  
  document.querySelectorAll(".card").forEach(card => {
    let start = parseInt(card.dataset.startAt);
    const delay = parseInt(card.dataset.delay || 0);
    const countdownEl = card.querySelector(".countdown");

    if (delay > 0) {
      const start_old = start;
      while (start + delay <= now) { start += delay; }

      if (start !== start_old) {
        const cardId = card.dataset.id;

        // --- LÓGICA DE TRASPASO DE BARRA ---
        // Si esta carta que va a sonar es la que tiene la barra...
        if (redLineAnchorId === cardId) {
          // Buscamos la carta que tiene justo arriba en el HTML
          const cardArriba = card.previousElementSibling;
          
          // Si hay una carta arriba y no es la propia barra roja...
          if (cardArriba && cardArriba.classList.contains('card')) {
            redLineAnchorId = cardArriba.dataset.id;
          } else {
            // Si no hay nada arriba (era la única), soltamos el ancla
            // para que se asigne de nuevo al hacer el prepend
            redLineAnchorId = null;
          }
        }

        // 1. ROLLING: La carta se mueve al principio
        cardsContainer.prepend(card);
        card.dataset.startAt = start;
        
        // 2. ASIGNACIÓN INICIAL:
        // Si no hay ancla (primera vez tras minimizar o tras el traspaso nulo),
        // esta carta se convierte en el ancla.
        if (redLineAnchorId === null) {
          redLineAnchorId = card.dataset.id;
        }

        saveAllCards();

        if (Notification.permission === "granted") {
          const cardTitle = card.querySelector(".titleInput").value || "Sin título";
          new Notification(`${cardTitle}`, {
            body: "🚂",
            // icon: "tu_icono.png" // Por si luego quieres añadirle un logo
          });
          new Audio("ding.mp3").play().catch(() => {});
        }
      }
      
      // ... (resto de tu lógica de contador y transparencia) ...
      const nextRing = start + delay;
      const remaining = nextRing - now;
      const h = Math.floor(remaining / 3600000);
      const m = Math.floor(remaining / 60000) % 60;
      const s = Math.floor(remaining / 1000) % 60;
      countdownEl.textContent = `${h}h ${m}m ${s}s`;
      const elapsed = now - start;
      countdownEl.style.opacity = (elapsed <= 60000) ? (1 - (elapsed / 60000) * 0.8) : 0.2;
    }
  });

  // 3. DIBUJAR LA BARRA (Igual que antes, pero ahora el ID puede haber cambiado)
  if (redLineAnchorId && document.visibilityState === "visible") {
    const anchorCard = document.querySelector(`.card[data-id="${redLineAnchorId}"]`);
    if (anchorCard) {
      anchorCard.after(redLine);
      redLine.style.display = "block";
    }
  }
}

let wakeLock = null;

async function requestWakeLock() {
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    console.log("Wake lock activado");
    wakeLock.addEventListener("release", () => {
      console.log("Wake lock liberado");
    });
  } catch (err) {
    console.error(`${err.name}, ${err.message}`);
  }
}

// Pedirlo al cargar
document.addEventListener("DOMContentLoaded", () => {
  requestWakeLock();
});

// Variable para recordar a qué carta está pegada la barra
let redLineAnchorId = null;

// Creamos la barra una sola vez en memoria
const redLine = document.createElement("div");
redLine.id = "redLine";
redLine.style.cssText = "display:none; border-top: 3px solid red; margin: 15px 0; width: 100%;";

// AL MINIMIZAR: Soltamos el ancla (se desasigna)
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    redLineAnchorId = null; // Se desasigna
    redLine.style.display = "none";
    if (redLine.parentNode) redLine.parentNode.removeChild(redLine);
  }
});
    setInterval(checkRings, 1000);
  </script>
</body>
</html>
